name: Claude Review

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths-ignore:
      - "package-lock.json"
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # Scope by event so the reviewer's own progress comments (issue_comment /
  # review_comment) don't cancel the in-flight pull_request review.
  group: claude-review-${{ github.event.pull_request.number || github.issue.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  auto-review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request. Read README.md first for the site's
            milestones and cutover constraints, then review the diff against
            the priorities below, in order.

            Context: this is the Leaf Digital marketing site (Next.js App
            Router + Tailwind v4). Leaf sells accessibility tooling — the
            site itself failing accessibility is a brand-level bug, not a
            nit. Most PRs come from AI agents implementing Asana tickets
            (LF-x in the PR title); common agent failure modes are scope
            creep, div-soup markup, decorative ARIA, and copy drift from the
            ticket blueprints. Hunt those specifically.

            ## 1. Accessibility [blocking]
            - Semantic HTML first: landmarks, one h1 per page, heading
              levels never skip, lists are lists, buttons are buttons,
              links navigate. Flag div/span with click handlers.
            - ARIA only where semantics can't do it; flag redundant or
              decorative ARIA. Icon-only controls need accessible names.
            - Keyboard: everything interactive reachable and operable;
              visible focus; skip-link intact; no positive tabindex.
            - Contrast: 4.5:1 body text, 3:1 large text/UI. Flag light
              green text on white specifically — it is this brand's
              recurring temptation.
            - Animation respects prefers-reduced-motion.
            - Images: meaningful alt or alt="" for decorative — an
              alt-text company shipping bad alt text is a headline.

            ## 2. SEO regressions [blocking]
            - Metadata: every new page exports metadata (title,
              description); no page falls back to the root default
              silently.
            - Heading hierarchy and link text stay semantic (no "click
              here").
            - sitemap.ts/robots.ts updated when routes are added or
              removed.
            - No accidental noindex, no broken canonical, no orphaned
              pages.

            ## 3. Core Web Vitals
            - Layout shift: images/media carry dimensions; fonts load via
              next/font; no CLS-inducing late-mounting banners.
            - Images through next/image with sensible sizes; flag raw
              <img> for content images.
            - Client JS weight: flag "use client" on components that
              could stay server; heavy dependencies for trivial effects;
              animation libraries where CSS would do.

            ## 4. Copy consistency
            The Asana ticket blueprints are the copy spec. Flag: invented
            section structure, corporate filler ("empower", "seamless",
            "revolutionize"), hype that breaks the "smart friend who
            happens to be an expert" voice, and any drift in load-bearing
            lines (the four product laws, the mirror number, the "we only
            ever touch the alt field" reassurance) — those are verbatim.

            ## 5. Simplicity and type discipline
            No `any`, no non-null assertions, no eslint-disable without a
            written reason, no loosened configs. Flag speculative
            abstraction, dead code, hardcoded colors bypassing the design
            tokens, and components duplicating an existing primitive.

            ## 6. Scope
            The PR title carries its ticket IDs (LF-x). Flag any change
            not plausibly required by those tickets — drive-by refactors,
            renamed files, "improved" neighboring code. Out-of-scope
            diffs are [blocking] even when the code is good.

            ## How to report
            This is a read-only review: do not run typecheck, tests, lint,
            builds, or installs — CI owns those. Judge the code by reading
            it, and do not mention being unable to run checks.
            Post inline comments on specific lines with concrete
            suggestions (prefer GitHub suggestion blocks for small fixes).
            Mark each finding [blocking] or [nit]. Do not comment on
            formatting — Prettier/ESLint own it. Review only the diff:
            read surrounding code for context, but do not demand refactors
            of pre-existing code the PR doesn't touch. If the same issue
            repeats, flag it once and note where else it applies. If the
            PR is clean, say so briefly with a summary of what you
            checked. A few high-value findings beat an exhaustive list.
          claude_args: |
            --model claude-opus-4-8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --max-turns 60
          track_progress: true

  mention:
    if: >-
      github.event_name != 'pull_request' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-4-8
